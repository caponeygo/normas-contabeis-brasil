name: Norma nova ou revisada
description: O CFC ou o CPC publicou uma norma nova, uma revisão (Rn) ou revogou uma norma.
labels: ["norma"]
body:
  - type: input
    id: norma
    attributes: {label: Norma, placeholder: "ex.: NBC TA 240 (R3)"}
    validations: {required: true}
  - type: dropdown
    id: tipo
    attributes:
      label: O que aconteceu
      options: ["Norma nova", "Nova revisão", "Revogada"]
    validations: {required: true}
  - type: input
    id: link
    attributes: {label: Link oficial}
    validations: {required: true}
