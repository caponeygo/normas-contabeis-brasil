# Verificação automática do índice:
#  - toda segunda: links oficiais (CFC e CPC) + monitor de normas novas/revisadas no CFC
#  - na primeira segunda do mês (ou manual): também baixa os PDFs e confere itens e resumos
# Se algo precisar de atenção, o workflow falha (o GitHub avisa o dono por e-mail) e anexa os relatórios.
name: Verificar normas

on:
  schedule:
    - cron: "0 9 * * 1"        # segunda, 06:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["normas.json", "manutencao/scripts/**", "manutencao/testes/**", "GLOSSARIO.md", "lancamentos/**", "AGENTS.md"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decidir se confere o conteúdo (mensal)
        id: plano
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%d)" -le 7 -a "${{ github.event_name }}" = "schedule" ]; then
            echo "conteudo=sim" >> "$GITHUB_OUTPUT"
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Verificar links oficiais
        id: links
        continue-on-error: true
        run: python manutencao/scripts/verificar_links.py ${{ steps.plano.outputs.conteudo == 'sim' && '--baixar' || '' }}

      - name: Monitorar normas novas no CFC
        id: monitor
        continue-on-error: true
        run: python manutencao/scripts/monitorar_cfc.py

      - name: Links internos entre os arquivos
        id: internos
        continue-on-error: true
        run: python manutencao/scripts/verificar_links_internos.py

      - name: Testar se a busca acha o arquivo certo
        id: busca
        continue-on-error: true
        run: python manutencao/scripts/testar_busca.py

      - name: Conferir itens e resumos contra o texto oficial
        id: itens
        if: steps.plano.outputs.conteudo == 'sim'
        continue-on-error: true
        run: python manutencao/scripts/verificar_itens.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-verificacao
          path: manutencao/verificacao/*.md

      - name: Falhar se houver algo a conferir (o GitHub avisa o dono por e-mail)
        if: steps.links.outcome == 'failure' || steps.monitor.outcome == 'failure' || steps.itens.outcome == 'failure' || steps.busca.outcome == 'failure' || steps.internos.outcome == 'failure'
        run: |
          echo "::error::Verificação encontrou pontos a conferir. Veja os relatórios no artefato 'relatorios-verificacao'."
          exit 1
